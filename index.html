<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC Loco LIVE</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#101018;color:white;font-family:Arial,sans-serif;text-align:center}
#cara{font-size:100px;animation:saltar .7s infinite alternate}
h1{color:#ff4fa3}
#estado{padding:14px;background:#242436;border-radius:12px}
button{padding:14px 22px;border:0;border-radius:12px;background:#ff4fa3;color:white;font-size:18px;cursor:pointer}
@keyframes saltar{to{transform:translateY(-15px) rotate(5deg)}}
</style>
</head>
<body>
<h1>NPC LOCO LIVE</h1>
<div id="cara">🤪</div>
<h2 id="frase">¡Estoy esperando regalos!</h2>
<p id="estado">Personaje iniciado</p>
<button onclick="reaccionar()">Probar reacción</button>
<script>
const frases=[
"¡¿QUÉ FUE ESO?! 😂",
"¡Mándate otro regalo!",
"¡Estoy más perdido que micro sin recorrido!",
"¡Chat, ustedes están locos!",
"¡Se me reinició el cerebro!"
];
function reaccionar(){
document.getElementById("frase").textContent=frases[Math.floor(Math.random()*frases.length)];
document.getElementById("cara").textContent=["🤪","😱","🤖","😂","🥴"][Math.floor(Math.random()*5)];
document.getElementById("estado").textContent="¡Reacción activada!";
}
</script>
</body>
</html>
